plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
    id 'kotlin-android'

}

android {
    namespace "com.gtxprime.vtroid"
    
    // Load signing properties from local.properties if available
    def keystorePropertiesFile = rootProject.file("local.properties")
    def keystoreProperties = new Properties()
    if (keystorePropertiesFile.exists()) {
        keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    }

    signingConfigs {
        release {
            if (keystoreProperties.containsKey('release.storeFile')) {
                storeFile file(keystoreProperties['release.storeFile'])
                storePassword keystoreProperties['release.storePassword']
                keyAlias keystoreProperties['release.keyAlias']
                keyPassword keystoreProperties['release.keyPassword']
            } else {
                // Fallback dummy properties to prevent Gradle configuration errors on clean checkouts
                storeFile file("dummy.jks")
                storePassword "dummy_password"
                keyAlias "dummy"
                keyPassword "dummy_password"
            }
            v1SigningEnabled true
            v2SigningEnabled true
        }

        debug {
            v1SigningEnabled true
            v2SigningEnabled true

            // Add debug keystore credentials here
        }

    }
    compileSdk 36

    defaultConfig {
        applicationId 'com.gtxprime.vtroid'
        minSdk 24
        targetSdk 37
        versionCode 26
        versionName '5.9 Z Mark'
        multiDexEnabled true

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        signingConfig signingConfigs.release
        vectorDrawables.useSupportLibrary = true
    }

    buildFeatures {
        viewBinding true
        dataBinding true
    }

    buildTypes {
        release {
            shrinkResources false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            multiDexEnabled true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    dependenciesInfo {
        includeInApk true
        includeInBundle true
    }

    configurations {
        cleanedAnnotations
        compile.exclude group: 'org.jetbrains' , module: 'annotaions'
    }
    ndkVersion '26.1.10909125'
    packaging {
        jniLibs {
            useLegacyPackaging true
        }
        resources {
            excludes += "META-INF/versions/9/OSGI-INF/MANIFEST.MF"
        }
    }


}

